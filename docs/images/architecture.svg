<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 730" role="img" aria-label="Demonstração e produção, etapa por etapa"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1290" height="730" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Demonstração e produção, etapa por etapa</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">O método é o mesmo. Mudam a origem dos dados e a frequência de cada etapa. O repositório implementa apenas a demonstração</text><text x="30" y="98" font-size="11" font-weight="700" text-anchor="start" fill="#687078">DEMONSTRAÇÃO (ESTE REPOSITÓRIO): uv run cli.py demo</text><text x="30" y="322" font-size="11" font-weight="700" text-anchor="start" fill="#687078">PRODUÇÃO (REFERÊNCIA): o mesmo método ligado a dados ao vivo</text><rect x="30" y="110" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="42" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Dados</text><text x="42" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Simulador (simulate.py)</text><text x="42" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">grava transactions_1min.csv.</text><rect x="30" y="335" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="42" y="361" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">Dados</text><text x="42" y="379" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Métricas da aplicação, fluxo</text><text x="42" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">de eventos ou réplica,</text><text x="42" y="411" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">guardados em um banco de</text><text x="42" y="427" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">séries.</text><path d="M260,175 L278,175" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><path d="M260,400 L278,400" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="110" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="292" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Limpeza e perfil</text><text x="292" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">cleaning.py e profile.py</text><text x="292" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">rodam a cada execução.</text><rect x="280" y="335" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="292" y="361" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">Limpeza e perfil</text><text x="292" y="379" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Job diário grava o histórico</text><text x="292" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">limpo e o perfil de cada</text><text x="292" y="411" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">dia.</text><path d="M510,175 L528,175" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><path d="M510,400 L528,400" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="110" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="542" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Ajuste ao vivo</text><text x="542" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">forecasting.run_day percorre</text><text x="542" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">o dia inteiro de uma vez.</text><rect x="530" y="335" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="542" y="361" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">Ajuste ao vivo</text><text x="542" y="379" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Serviço a cada 5 minutos.</text><text x="542" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Guarda o ritmo (alfa) e o</text><text x="542" y="411" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">estado de cada canal.</text><path d="M760,175 L778,175" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><path d="M760,400 L778,400" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="780" y="110" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="792" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Faixa P10 a P90</text><text x="792" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">quantile_model.py treina e</text><text x="792" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">snapshots.py projeta.</text><rect x="780" y="335" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="792" y="361" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">Faixa P10 a P90</text><text x="792" y="379" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">LightGBM treinado toda</text><text x="792" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">semana e carregado pelo</text><text x="792" y="411" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">serviço.</text><path d="M1010,175 L1028,175" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><path d="M1010,400 L1028,400" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="1030" y="110" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="1042" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Saída</text><text x="1042" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">dashboard.html e gráfico SVG</text><text x="1042" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">do dia.</text><rect x="1030" y="335" width="228" height="130" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="1042" y="361" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">Saída</text><text x="1042" y="379" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">API ou painel e alertas de</text><text x="1042" y="395" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">queda e pico.</text><text x="30" y="510" font-size="11" font-weight="700" text-anchor="start" fill="#687078">ROTINAS AGENDADAS, FORA DO CICLO DE 5 MINUTOS</text><rect x="30" y="525" width="290" height="100" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="42" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Limpeza diária</text><text x="42" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">clean_history marca o que é sujo e</text><text x="42" y="585" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">LevelModel refaz o nível do dia.</text><rect x="340" y="525" width="290" height="100" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="352" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Treino semanal</text><text x="352" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">quantile_model.train refaz o</text><text x="352" y="585" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">LightGBM com o histórico limpo.</text><rect x="650" y="525" width="290" height="100" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="662" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Avaliação</text><text x="662" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">evaluate mede o erro contra o piso</text><text x="662" y="585" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">de ruído e a cobertura da faixa.</text><rect x="960" y="525" width="290" height="100" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="972" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Calendário</text><text x="972" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Configure COUNTRY e SUBDIVISION. A</text><text x="972" y="585" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">biblioteca holidays fornece as</text><text x="972" y="601" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">datas.</text><text x="30" y="660" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Entrada mínima em produção: ts, channel e count de cada minuto. Não é necessário consultar o banco transacional.</text><text x="30" y="681" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Estado a guardar por canal: o ritmo (alfa) e o estado do último intervalo. O restante é recalculado a partir do histórico.</text><text x="30" y="702" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Esta arquitetura é uma referência. As ferramentas de cada etapa são opções a escolher conforme o ambiente de quem adapta o método.</text></svg>