<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 800" role="img" aria-label="Quando o modelo se atualiza"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1250" height="800" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Quando o modelo se atualiza</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">Dois ritmos: tudo é refeito a cada execução, e o ritmo do dia é ajustado a cada 5 minutos</text><text x="30" y="98" font-size="11" font-weight="700" text-anchor="start" fill="#687078">A CADA EXECUÇÃO</text><text x="160" y="98" font-size="11" font-weight="400" text-anchor="start" fill="#687078">No demo, a cada comando. Em produção, limpeza e perfil por dia e LightGBM por semana</text><rect x="30" y="110" width="285" height="80" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="42" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">1  Ler o histórico</text><text x="42" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Até ontem. Hoje fica fora do treino.</text><path d="M317,150 L333,150" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="335" y="110" width="285" height="80" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="347" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">2  Refazer a limpeza</text><text x="347" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Marca de novo o que é sujo no histórico.</text><path d="M622,150 L638,150" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="110" width="285" height="80" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="652" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">3  Refazer o perfil</text><text x="652" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Regressão do nível e forma dos dias</text><text x="652" y="170" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">parecidos.</text><path d="M927,150 L943,150" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="945" y="110" width="285" height="80" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/><text x="957" y="136" font-size="13" font-weight="700" text-anchor="start" fill="#ED7100">4  Refazer o LightGBM</text><text x="957" y="154" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Faixa P10 a P90 com o histórico limpo.</text><text x="30" y="214" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Nada fica salvo em disco. O modelo de hoje inclui o que aconteceu ontem, e um evento limpo hoje sai do aprendizado de amanhã.</text><text x="30" y="262" font-size="11" font-weight="700" text-anchor="start" fill="#687078">A CADA 5 MINUTOS, DURANTE O DIA</text><rect x="30" y="280" width="230" height="80" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="42" y="306" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Novo intervalo</text><text x="42" y="324" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Contagem dos 5 minutos que</text><text x="42" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">acabaram de fechar.</text><path d="M262,320 L322,320" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><polygon points="440,270 560,320 440,370 320,320" fill="#FFF8F0" stroke="#ED7100" stroke-width="2"/><text x="440" y="316" font-size="13" font-weight="700" text-anchor="middle" fill="#16191F">É um evento?</text><text x="440" y="334" font-size="11" font-weight="400" text-anchor="middle" fill="#687078">razão contra o perfil</text><path d="M562,320 L632,320" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#ar)"/><rect x="581.43" y="295" width="31.139999999999997" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="597" y="310" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">Não</text><rect x="634" y="280" width="270" height="80" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="646" y="306" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Atualizar o ritmo</text><text x="646" y="324" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">O alfa passa a incluir o</text><text x="646" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">intervalo novo.</text><path d="M906,320 L966,320" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="968" y="280" width="252" height="80" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="980" y="306" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Projetar o resto do dia</text><text x="980" y="324" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Perfil vezes o ritmo, com</text><text x="980" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">efeito que cai em 2 horas.</text><path d="M440,372 L440,433 L634,433" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#ar)"/><rect x="446.43" y="385" width="31.139999999999997" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="462" y="400" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">Sim</text><rect x="634" y="385" width="270" height="96" rx="6" fill="#FDF3F1" stroke="#D13212" stroke-width="1.8"/><text x="646" y="411" font-size="13" font-weight="700" text-anchor="start" fill="#D13212">Congelar o ritmo</text><text x="646" y="429" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Ignora o dado sujo e projeta o</text><text x="646" y="445" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">dia como teria sido sem o</text><text x="646" y="461" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">evento.</text><path d="M906,433 L966,433" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="968" y="385" width="252" height="96" rx="6" fill="#FFFFFF" stroke="#687078" stroke-width="1.8"/><text x="980" y="411" font-size="13" font-weight="700" text-anchor="start" fill="#687078">Voltar ao normal</text><text x="980" y="429" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Após 3 intervalos normais</text><text x="980" y="445" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">seguidos, o ritmo volta a ser</text><text x="980" y="461" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">atualizado.</text><text x="30" y="510" font-size="11" font-weight="700" text-anchor="start" fill="#687078">NÃO SE AJUSTA SOZINHO</text><text x="215" y="510" font-size="11" font-weight="400" text-anchor="start" fill="#687078">Mude em config.py e day_features.py, e use o comando tune para escolher</text><rect x="30" y="525" width="390" height="78" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="42" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Limiares de evento</text><text x="42" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">0,55 e 1,45 do esperado, com 3 intervalos seguidos.</text><rect x="440" y="525" width="390" height="78" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="452" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Calendário</text><text x="452" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">País e região dos feriados e dias 5 a 10 de início</text><text x="452" y="585" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">de mês.</text><rect x="850" y="525" width="390" height="78" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="862" y="551" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Hiperparâmetros</text><text x="862" y="569" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Janelas, margens e rodadas do LightGBM.</text><text x="30" y="640" font-size="11" font-weight="700" text-anchor="start" fill="#687078">DIAS FUTUROS (PRÓXIMOS 30)</text><text x="240" y="640" font-size="11" font-weight="400" text-anchor="start" fill="#687078">Calculados, não observados</text><rect x="30" y="655" width="1190" height="100" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="1.8"/><text x="46" y="685" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">A projeção é o perfil do calendário, com uma faixa derivada dos erros dos últimos 28 dias. Não há ajuste ao vivo, porque ainda não existe dado do dia.</text><text x="46" y="725" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">No painel, tudo é calculado antes e gravado no HTML. Em produção, o bloco de 5 minutos roda continuamente e o restante em execuções agendadas.</text></svg>