<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 660" role="img" aria-label="Do dado à projeção"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1290" height="660" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Do dado à projeção</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">Entradas, etapas do modelo e saídas. Cada canal (app, site e whatsapp) passa pelo fluxo separadamente</text><rect x="30" y="85" width="330" height="96" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="42" y="111" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Contagem de transações por minuto</text><text x="42" y="129" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Arquivo com 3 colunas: ts, channel e</text><text x="42" y="145" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">count. Nenhuma marcação de incidente.</text><rect x="390" y="85" width="870" height="96" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="1.8"/><text x="402" y="111" font-size="13" font-weight="700" text-anchor="start" fill="#3F8624">Calendário</text><text x="402" y="129" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Feriados da biblioteca holidays e regras de dias sazonais em day_features.py. Alimenta a escolha de dias</text><text x="402" y="145" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">parecidos (etapa 2) e a regressão do perfil (etapa 3).</text><path d="M143,183 L143,223" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><path d="M420,183 L420,223" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><path d="M635,183 L635,223" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="225" width="226" height="250" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="30" y="225" width="226" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="30" y="251" width="226" height="10" fill="#ED7100"/><text x="42" y="249" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">1  Agrupar</text><text x="42" y="287" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">O QUE FAZ</text><text x="42" y="304" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Soma as contagens de 1 minuto</text><text x="42" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">em intervalos de 5 minutos.</text><text x="42" y="336" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Cada dia tem 288.</text><text x="42" y="364" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">ARQUIVO</text><text x="42" y="381" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">data.py (pandas)</text><text x="42" y="409" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">PRODUZ</text><text x="42" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Matriz de dias por 288</text><text x="42" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">intervalos, por canal</text><path d="M258,375 L274,375" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="276" y="225" width="226" height="259" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="276" y="225" width="226" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="276" y="251" width="226" height="10" fill="#ED7100"/><text x="288" y="249" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">2  Limpar</text><text x="288" y="287" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">O QUE FAZ</text><text x="288" y="304" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Compara cada dia com dias</text><text x="288" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">parecidos. Queda, retenção e</text><text x="288" y="336" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">pico anormal saem do</text><text x="288" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">aprendizado.</text><text x="288" y="380" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">ARQUIVO</text><text x="288" y="397" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">cleaning.py (pandas, numpy)</text><text x="288" y="425" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">PRODUZ</text><text x="288" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Histórico limpo e lista do</text><text x="288" y="458" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">que foi removido</text><path d="M504,375 L520,375" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="522" y="225" width="226" height="259" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="2"/><rect x="522" y="225" width="226" height="36" rx="6" fill="#3F8624" stroke="#3F8624" stroke-width="1.5"/><rect x="522" y="251" width="226" height="10" fill="#3F8624"/><text x="534" y="249" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">3  Montar o perfil</text><text x="534" y="287" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">O QUE FAZ</text><text x="534" y="304" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Nível do dia, por regressão</text><text x="534" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">sobre o calendário, vezes a</text><text x="534" y="336" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">forma média dos dias</text><text x="534" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">parecidos.</text><text x="534" y="380" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">ARQUIVO</text><text x="534" y="397" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">profile.py (numpy)</text><text x="534" y="425" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">PRODUZ</text><text x="534" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Volume esperado de cada</text><text x="534" y="458" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">intervalo</text><path d="M750,375 L766,375" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="768" y="225" width="226" height="259" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/><rect x="768" y="225" width="226" height="36" rx="6" fill="#8C4FFF" stroke="#8C4FFF" stroke-width="1.5"/><rect x="768" y="251" width="226" height="10" fill="#8C4FFF"/><text x="780" y="249" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">4  Ajustar ao vivo</text><text x="780" y="287" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">O QUE FAZ</text><text x="780" y="304" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">A cada 5 minutos, compara</text><text x="780" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">hoje com o perfil e corrige o</text><text x="780" y="336" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">resto do dia. Em evento,</text><text x="780" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">congela o ajuste.</text><text x="780" y="380" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">ARQUIVO</text><text x="780" y="397" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">forecasting.py (numpy)</text><text x="780" y="425" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">PRODUZ</text><text x="780" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Projeção do resto do dia e</text><text x="780" y="458" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">estado do momento</text><path d="M996,375 L1012,375" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="1014" y="225" width="226" height="275" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/><rect x="1014" y="225" width="226" height="36" rx="6" fill="#01A88D" stroke="#01A88D" stroke-width="1.5"/><rect x="1014" y="251" width="226" height="10" fill="#01A88D"/><text x="1026" y="249" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">5  Estimar a faixa</text><text x="1026" y="287" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">O QUE FAZ</text><text x="1026" y="304" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">LightGBM prevê a largura da</text><text x="1026" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">faixa P10 a P90. Dias futuros</text><text x="1026" y="336" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">usam os erros dos últimos 28</text><text x="1026" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">dias.</text><text x="1026" y="380" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">ARQUIVO</text><text x="1026" y="397" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">quantile_model.py,</text><text x="1026" y="413" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">snapshots.py (LightGBM)</text><text x="1026" y="441" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">PRODUZ</text><text x="1026" y="458" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Faixa com cerca de 80% do</text><text x="1026" y="474" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">observado</text><text x="30" y="513" font-size="11" font-weight="700" text-anchor="start" fill="#687078">SAÍDAS, POR CANAL</text><rect x="30" y="519" width="290" height="70" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="42" y="545" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Projeção do resto do dia</text><text x="42" y="563" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">um valor a cada 5 minutos</text><rect x="340" y="519" width="290" height="70" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="352" y="545" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Faixa P10 a P90</text><text x="352" y="563" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">limites baixo e alto de cada</text><text x="352" y="579" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">intervalo</text><rect x="650" y="519" width="290" height="70" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="662" y="545" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Eventos detectados</text><text x="662" y="563" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">queda, retenção e pico, com o</text><text x="662" y="579" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">horário</text><rect x="960" y="519" width="290" height="70" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="972" y="545" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Próximos 30 dias</text><text x="972" y="563" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">perfil e faixa de cada dia futuro</text><text x="30" y="617" font-size="12" font-weight="400" text-anchor="start" fill="#687078">As etapas 1 a 3 e o treino do LightGBM são refeitos a cada execução. A etapa 4 e a aplicação da faixa rodam a cada 5 minutos.</text><text x="30" y="637" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Onde ver: out/dashboard.html (painel interativo) e out/projection_AAAA-MM-DD.svg (gráfico do dia).</text></svg>