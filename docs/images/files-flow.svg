<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 700" role="img" aria-label="Arquivos do demo"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1250" height="700" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Arquivos do demo: quem gera e quem lê</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">O comando demo executa simulate, evaluate, today e dashboard, nessa ordem</text><rect x="30" y="85" width="270" height="300" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="30" y="85" width="270" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="30" y="111" width="270" height="10" fill="#ED7100"/><text x="42" y="109" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">simulate</text><text x="42" y="147" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">ARQUIVO</text><text x="42" y="164" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">sanecast/simulate.py</text><text x="42" y="192" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">O QUE FAZ</text><text x="42" y="209" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Gera 400 dias de histórico até</text><text x="42" y="225" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">hoje e 30 dias à frente, com</text><text x="42" y="241" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">queda, retenção e pico em</text><text x="42" y="257" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">datas conhecidas.</text><rect x="360" y="85" width="520" height="90" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="372" y="111" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">data/transactions_1min.csv</text><text x="372" y="129" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Entrada do modelo. Contagem por minuto, canal e dia, até hoje.</text><text x="372" y="145" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Única entrada que existe também com dados reais.</text><path d="M302,235 L358,130" fill="none" stroke="#687078" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="190" width="520" height="90" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.8"/><text x="372" y="216" font-size="13" font-weight="700" text-anchor="start" fill="#8C4FFF">data/truth_1min.csv</text><text x="372" y="234" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Gabarito, só na simulação. Taxa verdadeira e minutos afetados por</text><text x="372" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">evento. Mede o acerto. O modelo não lê.</text><path d="M302,235 L358,235" fill="none" stroke="#687078" stroke-width="1.6" marker-end="url(#a)"/><rect x="360" y="295" width="520" height="90" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="1.8"/><text x="372" y="321" font-size="13" font-weight="700" text-anchor="start" fill="#01A88D">data/future_1min.csv</text><text x="372" y="339" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Os 30 dias depois de hoje, sorteados à parte. Só o painel lê, para</text><text x="372" y="355" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">a linha &quot;simulado&quot;. Dados reais não têm.</text><path d="M302,235 L358,340" fill="none" stroke="#687078" stroke-width="1.6" marker-end="url(#a)"/><rect x="930" y="85" width="290" height="130" rx="6" fill="#FFFFFF" stroke="#687078" stroke-width="1.8" stroke-dasharray="6 4"/><text x="942" y="111" font-size="13" font-weight="700" text-anchor="start" fill="#687078">data/reference/</text><text x="942" y="129" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Cópia fixa dos dados simulados,</text><text x="942" y="145" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">usada somente pelos testes. Os</text><text x="942" y="161" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">três arquivos ao lado são refeitos</text><text x="942" y="177" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">quando a data muda.</text><text x="30" y="408" font-size="11" font-weight="700" text-anchor="start" fill="#687078">COMANDOS QUE LEEM OS ARQUIVOS E GERAM AS SAÍDAS</text><rect x="30" y="420" width="290" height="164" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="30" y="420" width="290" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="30" y="446" width="290" height="10" fill="#ED7100"/><text x="42" y="444" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">evaluate</text><text x="42" y="476" font-size="11" font-weight="600" text-anchor="start" fill="#687078">Erro e cobertura</text><text x="42" y="496" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">LÊ</text><text x="42" y="513" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">transactions, truth</text><text x="42" y="541" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">GERA</text><text x="42" y="558" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">out/metrics.csv, out/coverage.csv</text><rect x="335" y="420" width="290" height="164" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="2"/><rect x="335" y="420" width="290" height="36" rx="6" fill="#3F8624" stroke="#3F8624" stroke-width="1.5"/><rect x="335" y="446" width="290" height="10" fill="#3F8624"/><text x="347" y="444" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">today</text><text x="347" y="476" font-size="11" font-weight="600" text-anchor="start" fill="#687078">Gráfico de um dia</text><text x="347" y="496" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">LÊ</text><text x="347" y="513" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">transactions</text><text x="347" y="541" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">GERA</text><text x="347" y="558" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">out/projection_AAAA-MM-DD.svg</text><rect x="640" y="420" width="290" height="164" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/><rect x="640" y="420" width="290" height="36" rx="6" fill="#01A88D" stroke="#01A88D" stroke-width="1.5"/><rect x="640" y="446" width="290" height="10" fill="#01A88D"/><text x="652" y="444" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">dashboard</text><text x="652" y="476" font-size="11" font-weight="600" text-anchor="start" fill="#687078">Painel interativo</text><text x="652" y="496" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">LÊ</text><text x="652" y="513" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">transactions, future</text><text x="652" y="541" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">GERA</text><text x="652" y="558" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">out/dashboard.html</text><rect x="945" y="420" width="290" height="164" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/><rect x="945" y="420" width="290" height="36" rx="6" fill="#8C4FFF" stroke="#8C4FFF" stroke-width="1.5"/><rect x="945" y="446" width="290" height="10" fill="#8C4FFF"/><text x="957" y="444" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">tune</text><text x="957" y="476" font-size="11" font-weight="600" text-anchor="start" fill="#687078">Variações de hiperparâmetros</text><text x="957" y="496" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">LÊ</text><text x="957" y="513" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">transactions, truth</text><text x="957" y="541" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">GERA</text><text x="957" y="558" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">out/tuning_grid.csv</text><text x="30" y="640" font-size="12" font-weight="400" text-anchor="start" fill="#687078">O painel não lê nenhum CSV ao abrir. O Python calcula tudo antes e grava os números dentro do HTML, e por isso ele abre sem servidor.</text><text x="30" y="660" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Nada do modelo fica salvo em disco: limpeza, perfil e LightGBM são refeitos a cada execução a partir de transactions_1min.csv.</text><text x="30" y="680" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Com dados reais, somente transactions_1min.csv existe. O painel mostra a projeção sem a linha &quot;simulado&quot;.</text></svg>