<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 600" role="img" aria-label="Fluxo macro de uma projeção em produção"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1320" height="600" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Fluxo macro de uma projeção em produção</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">Seis etapas e opções de ferramenta. Escolha uma opção por etapa. O repositório implementa apenas as etapas 3 a 5, na demonstração</text><rect x="30" y="90" width="192" height="330" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="2"/><rect x="30" y="90" width="192" height="36" rx="6" fill="#0073BB" stroke="#0073BB" stroke-width="1.5"/><rect x="30" y="116" width="192" height="10" fill="#0073BB"/><text x="42" y="114" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">1  Coletar</text><text x="42" y="152" font-size="10" font-weight="700" text-anchor="start" fill="#0073BB">PARA QUÊ</text><text x="42" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Capta a contagem de</text><text x="42" y="185" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">transações por canal, a</text><text x="42" y="201" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">cada minuto.</text><text x="42" y="231" font-size="10" font-weight="700" text-anchor="start" fill="#0073BB">OPÇÕES</text><text x="42" y="248" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Prometheus ou</text><text x="42" y="264" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">OpenMetrics</text><text x="42" y="282" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Kafka, Kinesis ou</text><text x="42" y="298" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Pub/Sub</text><text x="42" y="316" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Réplica ou CDC</text><text x="42" y="402" font-size="11" font-weight="700" text-anchor="start" fill="#0073BB">ENTREGA: Série por minuto</text><path d="M224,255 L238,255" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="90" width="192" height="330" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/><rect x="240" y="90" width="192" height="36" rx="6" fill="#8C4FFF" stroke="#8C4FFF" stroke-width="1.5"/><rect x="240" y="116" width="192" height="10" fill="#8C4FFF"/><text x="252" y="114" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">2  Guardar</text><text x="252" y="152" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">PARA QUÊ</text><text x="252" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Mantém a série de cada</text><text x="252" y="185" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">canal em 1 e 5 minutos.</text><text x="252" y="215" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">OPÇÕES</text><text x="252" y="232" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• ClickHouse</text><text x="252" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• TimescaleDB</text><text x="252" y="268" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• VictoriaMetrics ou</text><text x="252" y="284" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Mimir</text><text x="252" y="402" font-size="11" font-weight="700" text-anchor="start" fill="#8C4FFF">ENTREGA: Série bruta</text><path d="M434,255 L448,255" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="450" y="90" width="192" height="330" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="450" y="90" width="192" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="450" y="116" width="192" height="10" fill="#ED7100"/><text x="462" y="114" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">3  Limpar</text><text x="462" y="152" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">PARA QUÊ</text><text x="462" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Compara cada dia com</text><text x="462" y="185" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">dias parecidos. Marca</text><text x="462" y="201" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">queda, retenção e pico</text><text x="462" y="217" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">anormal.</text><text x="462" y="247" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">OPÇÕES</text><text x="462" y="264" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Python com pandas e</text><text x="462" y="280" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">numpy</text><text x="462" y="298" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Job diário (cron,</text><text x="462" y="314" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Airflow)</text><text x="462" y="332" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• cleaning.py</text><text x="462" y="402" font-size="11" font-weight="700" text-anchor="start" fill="#ED7100">ENTREGA: Histórico limpo</text><path d="M644,255 L658,255" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="90" width="192" height="330" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="2"/><rect x="660" y="90" width="192" height="36" rx="6" fill="#3F8624" stroke="#3F8624" stroke-width="1.5"/><rect x="660" y="116" width="192" height="10" fill="#3F8624"/><text x="672" y="114" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">4  Prever</text><text x="672" y="152" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">PARA QUÊ</text><text x="672" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Perfil do dia, ritmo do</text><text x="672" y="185" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">dia e faixa P10 a P90.</text><text x="672" y="215" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">OPÇÕES</text><text x="672" y="232" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Python e LightGBM</text><text x="672" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• StatsForecast</text><text x="672" y="266" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">(comparação)</text><text x="672" y="284" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• forecasting.py</text><text x="672" y="402" font-size="11" font-weight="700" text-anchor="start" fill="#3F8624">ENTREGA: Projeção e faixa</text><path d="M854,255 L868,255" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="870" y="90" width="192" height="330" rx="6" fill="#FFFFFF" stroke="#D13212" stroke-width="2"/><rect x="870" y="90" width="192" height="36" rx="6" fill="#D13212" stroke="#D13212" stroke-width="1.5"/><rect x="870" y="116" width="192" height="10" fill="#D13212"/><text x="882" y="114" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">5  Vigiar</text><text x="882" y="152" font-size="10" font-weight="700" text-anchor="start" fill="#D13212">PARA QUÊ</text><text x="882" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Detecta o evento,</text><text x="882" y="185" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">congela o ajuste e</text><text x="882" y="201" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">ignora o dado sujo até</text><text x="882" y="217" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">normalizar.</text><text x="882" y="247" font-size="10" font-weight="700" text-anchor="start" fill="#D13212">OPÇÕES</text><text x="882" y="264" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Estados NORMAL,</text><text x="882" y="280" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">OUTAGE, SURGE e</text><text x="882" y="296" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">RECOVERY</text><text x="882" y="314" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Cache do estado</text><text x="882" y="330" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">(Redis)</text><text x="882" y="402" font-size="11" font-weight="700" text-anchor="start" fill="#D13212">ENTREGA: Estado e eventos</text><path d="M1064,255 L1078,255" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="1080" y="90" width="192" height="330" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/><rect x="1080" y="90" width="192" height="36" rx="6" fill="#01A88D" stroke="#01A88D" stroke-width="1.5"/><rect x="1080" y="116" width="192" height="10" fill="#01A88D"/><text x="1092" y="114" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">6  Entregar</text><text x="1092" y="152" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">PARA QUÊ</text><text x="1092" y="169" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Mostra a projeção contra</text><text x="1092" y="185" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">o observado e avisa</text><text x="1092" y="201" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">quando o volume sai da</text><text x="1092" y="217" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">faixa.</text><text x="1092" y="247" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">OPÇÕES</text><text x="1092" y="264" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Painel HTML ou API</text><text x="1092" y="282" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Grafana ou Datadog</text><text x="1092" y="300" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">• Slack ou PagerDuty</text><text x="1092" y="402" font-size="11" font-weight="700" text-anchor="start" fill="#01A88D">ENTREGA: Painel e alertas</text><text x="30" y="452" font-size="11" font-weight="700" text-anchor="start" fill="#687078">APOIO FORA DO CICLO DE 5 MINUTOS</text><rect x="30" y="460" width="228" height="90" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="42" y="486" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Treino semanal</text><text x="42" y="504" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">LightGBM com histórico limpo</text><rect x="275" y="460" width="228" height="90" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="287" y="486" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Avaliação</text><text x="287" y="504" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Erro contra o piso de ruído</text><text x="287" y="520" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">e cobertura</text><rect x="520" y="460" width="228" height="90" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="532" y="486" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Calendário</text><text x="532" y="504" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Feriados atualizados uma vez</text><text x="532" y="520" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">por ano</text><rect x="765" y="460" width="228" height="90" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="777" y="486" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Orquestração</text><text x="777" y="504" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">cron, Airflow ou Argo</text><rect x="1010" y="460" width="228" height="90" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="1022" y="486" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Monitoramento</text><text x="1022" y="504" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Erro e cobertura em produção</text></svg>