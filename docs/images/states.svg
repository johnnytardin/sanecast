<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Estados do ajuste ao vivo"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1000" height="700" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Estados do ajuste ao vivo</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">A cada 5 minutos o modelo decide se o dado novo é normal. Somente o dado normal atualiza o ritmo do dia</text><rect x="60" y="275" width="170" height="96" rx="10" fill="#F3F9F0" stroke="#3F8624" stroke-width="2.2"/><text x="145" y="305" font-size="15" font-weight="700" text-anchor="middle" fill="#3F8624">NORMAL</text><text x="145" y="327" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">Atualiza o ritmo a cada</text><text x="145" y="341" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">intervalo. A projeção</text><text x="145" y="355" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">segue o dado.</text><rect x="440" y="125" width="170" height="96" rx="10" fill="#FDF3F1" stroke="#D13212" stroke-width="2.2"/><text x="525" y="155" font-size="15" font-weight="700" text-anchor="middle" fill="#D13212">OUTAGE (queda)</text><text x="525" y="177" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">Congela o ritmo no valor</text><text x="525" y="191" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">de antes da queda.</text><text x="525" y="205" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">Ignora o dado atual.</text><rect x="790" y="125" width="170" height="96" rx="10" fill="#FFF8F0" stroke="#ED7100" stroke-width="2.2"/><text x="875" y="155" font-size="15" font-weight="700" text-anchor="middle" fill="#ED7100">RECOVERY</text><text x="875" y="177" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">Ignora o pico de</text><text x="875" y="191" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">retenção. O ritmo</text><text x="875" y="205" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">continua congelado.</text><rect x="440" y="425" width="170" height="96" rx="10" fill="#FDF3F1" stroke="#D13212" stroke-width="2.2"/><text x="525" y="455" font-size="15" font-weight="700" text-anchor="middle" fill="#D13212">SURGE (pico)</text><text x="525" y="477" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">Congela o ritmo. Ignora</text><text x="525" y="491" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">o dado até o volume</text><text x="525" y="505" font-size="11" font-weight="400" text-anchor="middle" fill="#16191F">voltar ao normal.</text><path d="M230,310 L440,175" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="265.2" y="227" width="139.6" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="335" y="242" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">(1) 3 seguidos &lt; 55%</text><path d="M610,173 L790,173" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="630.2" y="140" width="139.6" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="700" y="155" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">(2) 2 seguidos &gt; 80%</text><path d="M875,125 L875,80 L145,80 L145,275" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="405.11" y="69" width="209.77999999999997" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="510" y="84" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">(3) 3 seguidos entre 80% e 125%</text><path d="M230,350 L440,455" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="262.01" y="381" width="145.98" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="335" y="396" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">(4) 3 seguidos &gt; 145%</text><path d="M440,505 L145,505 L145,371" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="190.11" y="494" width="209.77999999999997" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="295" y="509" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">(5) 3 seguidos entre 80% e 125%</text><rect x="30" y="580" width="940" height="90" rx="6" fill="#F2F3F3" stroke="#AAB7B8" stroke-width="1"/><text x="46" y="606" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Os percentuais são relativos ao esperado. Nenhum estado tem prazo: cada um dura até o volume voltar ao normal, seja uma hora</text><text x="46" y="623" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">ou quatro, ou até o fim do dia. No dia seguinte, o modelo recomeça em NORMAL.</text><text x="46" y="656" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">A confirmação exige 3 intervalos seguidos (15 minutos). Nesse período, a projeção ainda é afetada pelo evento.</text></svg>