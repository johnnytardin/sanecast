<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 530" role="img" aria-label="Da demonstração à produção"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1290" height="530" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Da demonstração à produção</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">O método se mantém. Mudam as camadas de entrada, armazenamento e consulta</text><text x="30" y="98" font-size="12" font-weight="700" text-anchor="start" fill="#687078">DEMONSTRAÇÃO (este projeto)</text><rect x="30" y="110" width="190" height="100" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="2"/><rect x="30" y="110" width="190" height="36" rx="6" fill="#0073BB" stroke="#0073BB" stroke-width="1.5"/><rect x="30" y="136" width="190" height="10" fill="#0073BB"/><text x="42" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Histórico simulado</text><text x="42" y="166" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">CSV gerado pelo</text><text x="42" y="182" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">simulador</text><rect x="238" y="110" width="190" height="100" rx="6" fill="none" stroke="#AAB7B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="333.0" y="165" font-size="12" font-weight="400" text-anchor="middle" fill="#687078">não existe na demo</text><rect x="446" y="110" width="190" height="100" rx="6" fill="none" stroke="#AAB7B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="541.0" y="165" font-size="12" font-weight="400" text-anchor="middle" fill="#687078">não existe na demo</text><rect x="654" y="110" width="190" height="100" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="654" y="110" width="190" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="654" y="136" width="190" height="10" fill="#ED7100"/><text x="666" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Método de projeção</text><text x="666" y="166" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Limpeza, perfil, ajuste</text><text x="666" y="182" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">ao vivo e faixa</text><rect x="862" y="110" width="190" height="100" rx="6" fill="none" stroke="#AAB7B8" stroke-width="1.2" stroke-dasharray="5 4"/><text x="957.0" y="165" font-size="12" font-weight="400" text-anchor="middle" fill="#687078">não existe na demo</text><rect x="1070" y="110" width="190" height="100" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/><rect x="1070" y="110" width="190" height="36" rx="6" fill="#01A88D" stroke="#01A88D" stroke-width="1.5"/><rect x="1070" y="136" width="190" height="10" fill="#01A88D"/><text x="1082" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">dashboard.html</text><text x="1082" y="166" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Arquivo único, abre sem</text><text x="1082" y="182" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">servidor</text><text x="30" y="268" font-size="12" font-weight="700" text-anchor="start" fill="#687078">PRODUÇÃO</text><rect x="30" y="282" width="190" height="215" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="2"/><rect x="30" y="282" width="190" height="36" rx="6" fill="#0073BB" stroke="#0073BB" stroke-width="1.5"/><rect x="30" y="308" width="190" height="10" fill="#0073BB"/><text x="42" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Fontes</text><text x="42" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Métricas de aplicação,</text><text x="42" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">fluxo de eventos ou</text><text x="42" y="380" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">réplica</text><text x="42" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Só ts, channel e count.</text><text x="42" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Sem consultar o banco</text><text x="42" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#687078">transacional</text><path d="M222,390 L236,390" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="238" y="282" width="190" height="215" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="2"/><rect x="238" y="282" width="190" height="36" rx="6" fill="#3F8624" stroke="#3F8624" stroke-width="1.5"/><rect x="238" y="308" width="190" height="10" fill="#3F8624"/><text x="250" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Ingestão e tratamento</text><text x="250" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Validação, deduplicação</text><text x="250" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">e preenchimento de</text><text x="250" y="380" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">minutos sem dado</text><text x="250" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Dado inválido na entrada</text><text x="250" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#687078">afeta a limpeza e o</text><text x="250" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#687078">perfil</text><path d="M430,390 L444,390" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="446" y="282" width="190" height="215" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/><rect x="446" y="282" width="190" height="36" rx="6" fill="#8C4FFF" stroke="#8C4FFF" stroke-width="1.5"/><rect x="446" y="308" width="190" height="10" fill="#8C4FFF"/><text x="458" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Armazenamento</text><text x="458" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Banco de séries</text><text x="458" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">temporais</text><text x="458" y="394" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Guarda o histórico por</text><text x="458" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#687078">minuto e o estado do dia</text><text x="458" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#687078">de cada canal</text><path d="M638,390 L652,390" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="654" y="282" width="190" height="215" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="654" y="282" width="190" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="654" y="308" width="190" height="10" fill="#ED7100"/><text x="666" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Serviço de projeção</text><text x="666" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Jobs agendados que</text><text x="666" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">aplicam o método</text><text x="666" y="394" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Diário: limpeza e</text><text x="666" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#687078">perfil. Semanal:</text><text x="666" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#687078">LightGBM. A cada 5 min:</text><text x="666" y="442" font-size="12" font-weight="400" text-anchor="start" fill="#687078">previsão</text><path d="M846,390 L860,390" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="862" y="282" width="190" height="215" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/><rect x="862" y="282" width="190" height="36" rx="6" fill="#01A88D" stroke="#01A88D" stroke-width="1.5"/><rect x="862" y="308" width="190" height="10" fill="#01A88D"/><text x="874" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">API e alertas</text><text x="874" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Endpoint de consulta e</text><text x="874" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">regras de alerta</text><text x="874" y="394" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Outros sistemas pedem a</text><text x="874" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#687078">projeção e recebem aviso</text><text x="874" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#687078">de queda ou pico</text><path d="M1054,390 L1068,390" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="1070" y="282" width="190" height="215" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="2"/><rect x="1070" y="282" width="190" height="36" rx="6" fill="#0073BB" stroke="#0073BB" stroke-width="1.5"/><rect x="1070" y="308" width="190" height="10" fill="#0073BB"/><text x="1082" y="306" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">Painel ao vivo</text><text x="1082" y="348" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Painel e notificações em</text><text x="1082" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">tempo real</text><text x="1082" y="394" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Mostra projeção, faixa e</text><text x="1082" y="410" font-size="12" font-weight="400" text-anchor="start" fill="#687078">eventos conforme o dado</text><text x="1082" y="426" font-size="12" font-weight="400" text-anchor="start" fill="#687078">chega</text><path d="M749.0,212 L749.0,280" fill="none" stroke="#ED7100" stroke-width="2" marker-end="url(#ar)"/><rect x="704.72" y="235" width="88.55999999999999" height="20" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.5"/><text x="749.0" y="250" font-size="11" font-weight="600" text-anchor="middle" fill="#687078">mesmo método</text></svg>