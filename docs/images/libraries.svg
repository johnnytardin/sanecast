<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 760" role="img" aria-label="Onde entram as bibliotecas de previsão"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#232F3E"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ED7100"/></marker></defs><style>text{font-family:Amazon Ember, Arial, Helvetica, sans-serif}</style><rect width="1290" height="760" fill="#FFFFFF"/><text x="30" y="38" font-size="22" font-weight="700" text-anchor="start" fill="#232F3E">Onde entram as bibliotecas de previsão</text><text x="30" y="62" font-size="13" font-weight="400" text-anchor="start" fill="#687078">LightGBM gera a faixa da projeção. StatsForecast serve de comparação na avaliação. O restante é pandas e numpy</text><text x="30" y="98" font-size="11" font-weight="700" text-anchor="start" fill="#687078">A. PROJEÇÃO ENTREGUE</text><text x="205" y="98" font-size="11" font-weight="400" text-anchor="start" fill="#687078">uv run cli.py today, dashboard e demo</text><rect x="30" y="110" width="228" height="200" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="30" y="110" width="228" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="30" y="136" width="228" height="10" fill="#ED7100"/><text x="42" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">1  Agrupar</text><text x="42" y="172" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">O QUE FAZ</text><text x="42" y="189" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Soma as contagens em</text><text x="42" y="205" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">intervalos de 5 minutos.</text><text x="42" y="233" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">BIBLIOTECA</text><text x="42" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">pandas</text><path d="M260,210 L278,210" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="110" width="228" height="200" rx="6" fill="#FFFFFF" stroke="#ED7100" stroke-width="2"/><rect x="280" y="110" width="228" height="36" rx="6" fill="#ED7100" stroke="#ED7100" stroke-width="1.5"/><rect x="280" y="136" width="228" height="10" fill="#ED7100"/><text x="292" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">2  Limpar</text><text x="292" y="172" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">O QUE FAZ</text><text x="292" y="189" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Compara com dias parecidos e</text><text x="292" y="205" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">marca o dado sujo.</text><text x="292" y="233" font-size="10" font-weight="700" text-anchor="start" fill="#ED7100">BIBLIOTECA</text><text x="292" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">pandas, numpy</text><path d="M510,210 L528,210" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="530" y="110" width="228" height="200" rx="6" fill="#FFFFFF" stroke="#3F8624" stroke-width="2"/><rect x="530" y="110" width="228" height="36" rx="6" fill="#3F8624" stroke="#3F8624" stroke-width="1.5"/><rect x="530" y="136" width="228" height="10" fill="#3F8624"/><text x="542" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">3  Dia esperado</text><text x="542" y="172" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">O QUE FAZ</text><text x="542" y="189" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Regressão do nível e forma</text><text x="542" y="205" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">média dos dias parecidos.</text><text x="542" y="233" font-size="10" font-weight="700" text-anchor="start" fill="#3F8624">BIBLIOTECA</text><text x="542" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">numpy</text><path d="M760,210 L778,210" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="780" y="110" width="228" height="200" rx="6" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2"/><rect x="780" y="110" width="228" height="36" rx="6" fill="#8C4FFF" stroke="#8C4FFF" stroke-width="1.5"/><rect x="780" y="136" width="228" height="10" fill="#8C4FFF"/><text x="792" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">4  Ajuste ao vivo</text><text x="792" y="172" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">O QUE FAZ</text><text x="792" y="189" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Ritmo do dia (alfa) e</text><text x="792" y="205" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">estados, código próprio.</text><text x="792" y="233" font-size="10" font-weight="700" text-anchor="start" fill="#8C4FFF">BIBLIOTECA</text><text x="792" y="250" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">numpy</text><path d="M1010,210 L1028,210" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="1030" y="110" width="228" height="200" rx="6" fill="#FFFFFF" stroke="#01A88D" stroke-width="2"/><rect x="1030" y="110" width="228" height="36" rx="6" fill="#01A88D" stroke="#01A88D" stroke-width="1.5"/><rect x="1030" y="136" width="228" height="10" fill="#01A88D"/><text x="1042" y="134" font-size="14" font-weight="700" text-anchor="start" fill="#FFFFFF">5  Faixa P10 a P90</text><text x="1042" y="172" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">O QUE FAZ</text><text x="1042" y="189" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Três modelos quantílicos</text><text x="1042" y="205" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">(P10, P50 e P90) sobre a</text><text x="1042" y="221" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">razão observado/perfil.</text><text x="1042" y="249" font-size="10" font-weight="700" text-anchor="start" fill="#01A88D">BIBLIOTECA</text><text x="1042" y="266" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">LightGBM</text><text x="30" y="360" font-size="11" font-weight="700" text-anchor="start" fill="#687078">B. AVALIAÇÃO</text><text x="130" y="360" font-size="11" font-weight="400" text-anchor="start" fill="#687078">uv run cli.py evaluate: o que o modelo precisa vencer</text><rect x="30" y="380" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#0073BB" stroke-width="1.8"/><text x="42" y="406" font-size="13" font-weight="700" text-anchor="start" fill="#0073BB">Histórico limpo</text><text x="42" y="424" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Entrada de todos os</text><text x="42" y="440" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">métodos.</text><rect x="300" y="372" width="650" height="42" rx="6" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.4"/><text x="314" y="398" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Este modelo</text><text x="470" y="398" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">perfil, ritmo do dia e estados</text><text x="935" y="398" font-size="12" font-weight="700" text-anchor="end" fill="#ED7100">numpy, pandas</text><rect x="300" y="420" width="650" height="42" rx="6" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.4"/><text x="314" y="446" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">model_lgbm_p50</text><text x="470" y="446" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">centro pela mediana do LightGBM</text><text x="935" y="446" font-size="12" font-weight="700" text-anchor="end" fill="#ED7100">LightGBM</text><rect x="300" y="468" width="650" height="42" rx="6" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.4"/><text x="314" y="494" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">SeasonalNaive</text><text x="470" y="494" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">repete a mesma hora da semana anterior</text><text x="935" y="494" font-size="12" font-weight="700" text-anchor="end" fill="#ED7100">StatsForecast</text><rect x="300" y="516" width="650" height="42" rx="6" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.4"/><text x="314" y="542" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">MSTL</text><text x="470" y="542" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">tendência e sazonalidade diária e semanal</text><text x="935" y="542" font-size="12" font-weight="700" text-anchor="end" fill="#ED7100">StatsForecast</text><rect x="300" y="564" width="650" height="42" rx="6" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.4"/><text x="314" y="590" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Semana passada</text><text x="470" y="590" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">o mesmo intervalo, 7 dias antes</text><text x="935" y="590" font-size="12" font-weight="700" text-anchor="end" fill="#ED7100">sem biblioteca</text><rect x="300" y="612" width="650" height="42" rx="6" fill="#FFFFFF" stroke="#AAB7B8" stroke-width="1.4"/><text x="314" y="638" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Sem limpeza</text><text x="470" y="638" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">o mesmo modelo com o dado bruto</text><text x="935" y="638" font-size="12" font-weight="700" text-anchor="end" fill="#ED7100">numpy, pandas</text><path d="M232,425 L298,425" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><rect x="1010" y="380" width="250" height="130" rx="6" fill="#FFFFFF" stroke="#232F3E" stroke-width="1.8"/><text x="1022" y="406" font-size="13" font-weight="700" text-anchor="start" fill="#232F3E">Métricas</text><text x="1022" y="424" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">Erro contra o observado, erro</text><text x="1022" y="440" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">contra a taxa verdadeira e</text><text x="1022" y="456" font-size="12" font-weight="400" text-anchor="start" fill="#16191F">cobertura da faixa.</text><path d="M952,445 L1008,445" fill="none" stroke="#232F3E" stroke-width="2" marker-end="url(#a)"/><text x="30" y="690" font-size="12" font-weight="400" text-anchor="start" fill="#687078">O StatsForecast não faz parte da projeção entregue. Ele mostra se o modelo supera séries temporais prontas, que não conhecem o calendário.</text><text x="30" y="711" font-size="12" font-weight="400" text-anchor="start" fill="#687078">Em início de mês, feriado e dias sazonais fortes, o StatsForecast erra de 12% a 66% no dia seguinte, contra 3% a 9% do perfil (docs/RESULTS.md).</text></svg>